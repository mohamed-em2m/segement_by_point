seed: 42
output_dir: ./outputs
run_name: baseline_100pts

dataset:
  name: loveda
  root: ./data/LoveDA
  crop_size: 512
  domains: [Rural, Urban]
  max_train_images: null
  max_val_images: null
  subset_seed: 42
  augment: true
  rotations: true

model:
  architecture: unet
  encoder: resnet34
  pretrained: true
  num_classes: 7
  in_channels: 3

loss:
  name: partial_focal
  gamma: 2.0
  alpha: null
  strict: false

training:
  epochs: 30
  batch_size: 4
  num_workers: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  amp: true
  grad_clip: null
  log_interval: 20
  max_train_batches: null

point_sampling:
  strategy: random
  points_per_crop: 100
  ignore_index: 255
  fixed_points: true

evaluation:
  metrics: [miou, f1, pixel_accuracy]
  tile_size: 512
  tile_overlap: 0.25
  batch_size: 2
  every_n_epochs: 1
