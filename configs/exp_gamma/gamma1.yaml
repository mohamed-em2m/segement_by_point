# Experiment C (optional): focal gamma ablation at 100 random points.
# Intermediate slope; gamma=0 is partial CE, gamma=2 is the main setting.
seed: 42
output_dir: ./outputs/exp_gamma
run_name: gamma1_100pts_seed42

dataset: {name: loveda, root: ./data/LoveDA, crop_size: 512, domains: [Rural, Urban],
          max_train_images: 600, max_val_images: 200, subset_seed: 42,
          augment: true, rotations: true}
model: {architecture: unet, encoder: resnet34, pretrained: true, num_classes: 7, in_channels: 3}
loss: {name: partial_focal, gamma: 1.0, alpha: null, strict: false}
training: {epochs: 10, batch_size: 4, num_workers: 4, learning_rate: 0.001,
           weight_decay: 0.0001, optimizer: adamw, scheduler: cosine, amp: true,
           grad_clip: null, log_interval: 50, max_train_batches: null}
point_sampling: {strategy: random, points_per_crop: 100, ignore_index: 255, fixed_points: true}
evaluation: {metrics: [miou, f1, pixel_accuracy], tile_size: 512, tile_overlap: 0.25,
             batch_size: 2, every_n_epochs: 2}
