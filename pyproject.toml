[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pointseg"
version = "0.1.0"
description = "Point-supervised semantic segmentation on LoveDA with partial focal loss"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pointseg" }]
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "segmentation-models-pytorch>=0.4",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "scikit-learn>=1.3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "pre-commit>=3.7"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "pre-commit>=3.7"]
analysis = ["pandas>=2.0", "scikit-learn>=1.3"]

[project.scripts]
pointseg-train = "pointseg.training.train:main"
pointseg-eval = "pointseg.evaluation.validate:main"
pointseg-check-data = "pointseg.datasets.loveda:check_data_main"
pointseg-exp-density = "pointseg.experiments.run_point_density:main"
pointseg-exp-sampling = "pointseg.experiments.run_sampling_strategy:main"
pointseg-aggregate = "pointseg.experiments.aggregate:main"
pointseg-visualize = "pointseg.evaluation.visualize:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pointseg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end tests that train for a few steps"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pointseg"]
